---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zipline
spec:
  chartRef:
    kind: OCIRepository
    name: zipline
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      zipline:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/diced/zipline
              tag: 4.8.0@sha256:8ae3cdf8cdbba2ac98754e9fc4ccec67bbaa86b6e6ab1ccf9683ddcff85eee72
            env:
              TZ: Asia/Kolkata
              CORE_HOSTNAME: 0.0.0.0
              CORE_PORT: &port 3000
              CORE_RETURN_HTTPS_URLS: "true"
              CORE_TRUST_PROXY: "true"
              CORE_TEMP_DIRECTORY: /tmp/zipline
              CORE_DEFAULT_DOMAIN: share.${SECRET_DOMAIN}
              CORE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: CORE_SECRET
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: DATABASE_URL
              # object storage (NAS minio); endpoint/bucket/keys from the secret
              DATASOURCE_TYPE: s3
              DATASOURCE_S3_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: S3_ENDPOINT
              DATASOURCE_S3_BUCKET:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: S3_BUCKET
              DATASOURCE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: S3_ACCESS_KEY_ID
              DATASOURCE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: S3_SECRET_ACCESS_KEY
              DATASOURCE_S3_REGION: us-east-1
              DATASOURCE_S3_FORCE_PATH_STYLE: "true"
              # features
              FEATURES_OAUTH_REGISTRATION: "true"
              FEATURES_USER_REGISTRATION: "false"
              FEATURES_HEALTHCHECK: "true"
              FEATURES_THUMBNAILS_ENABLED: "true"
              FEATURES_THUMBNAILS_FORMAT: webp
              FEATURES_VERSION_CHECKING: "false"
              FEATURES_METRICS_ENABLED: "true"
              # oidc (Authelia)
              OAUTH_BYPASS_LOCAL_LOGIN: "true"
              OAUTH_OIDC_CLIENT_ID: zipline
              OAUTH_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: zipline-secret
                    key: OIDC_CLIENT_SECRET
              OAUTH_OIDC_AUTHORIZE_URL: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
              OAUTH_OIDC_TOKEN_URL: https://auth.${SECRET_DOMAIN}/api/oidc/token
              OAUTH_OIDC_USERINFO_URL: https://auth.${SECRET_DOMAIN}/api/oidc/userinfo
              OAUTH_OIDC_REDIRECT_URI: https://share.${SECRET_DOMAIN}/api/auth/oauth/oidc
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: zipline
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["share.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
