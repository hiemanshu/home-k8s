---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-db-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zipline-db-password
    template:
      data:
        username: "zipline"
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: zipline
---
# S3 credentials for the CNPG barman plugin's ObjectStore. The bucket/endpoint
# come from the shared ${S3_ENDPOINT}/${S3_BUCKET} substitution instead, so only
# the keys live here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cnpg-s3-secret
    template:
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: cnpg
