---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-db-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: zipline-db-password
    template:
      data:
        username: "zipline"
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: zipline
---
# Same value Kutt's own ExternalSecret renders, so the CNPG role and the app's
# connection string cannot drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kutt-db-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kutt-db-password
    template:
      data:
        username: "kutt"
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: kutt
