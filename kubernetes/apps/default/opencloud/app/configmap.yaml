---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-config
data:
  # Content-Security-Policy. OpenCloud ships a template that expects an
  # ${IDP_DOMAIN} placeholder; we hardcode Authelia instead. Without Authelia in
  # script-src/connect-src/frame-src the browser blocks the OIDC redirect.
  csp.yaml: |
    ---
    directives:
      child-src:
        - '''self'''
      connect-src:
        - '''self'''
        - 'blob:'
        - 'https://auth.${SECRET_DOMAIN}/'
        - 'https://update.opencloud.eu/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://auth.${SECRET_DOMAIN}/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'https://auth.${SECRET_DOMAIN}/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
        - 'blob:'
      worker-src:
        - '''self'''
        - 'blob:'
