---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kutt's own secrets. The DB password is the same value the CNPG role uses (see
# default/postgres-secrets), so the connection and the role cannot drift apart.
#
# Mail comes from the shared `smtp` item rather than a Kutt-specific one: Kutt's
# startup validation requires MAIL_* to be *set* even with mail disabled, so it
# needs credentials it will never use. Reusing the shared item is the repo's rule
# for exactly this case.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kutt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: SMTP_HOST
      remoteRef:
        key: smtp
        property: SMTP_HOST
    - secretKey: SMTP_PORT
      remoteRef:
        key: smtp
        property: SMTP_PORT
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: smtp
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: smtp
        property: SMTP_PASSWORD
  target:
    name: kutt-secret
    template:
      data:
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        # shared with the Authelia OIDC client for `kutt`
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        SMTP_HOST: "{{ .SMTP_HOST }}"
        SMTP_PORT: "{{ .SMTP_PORT }}"
        SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
  dataFrom:
    - extract:
        key: kutt
