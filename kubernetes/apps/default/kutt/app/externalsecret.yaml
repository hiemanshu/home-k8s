---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kutt's own secrets. The DB password is the same value the CNPG role uses (see
# default/postgres-secrets), so the connection and the role cannot drift apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kutt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kutt-secret
    template:
      data:
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        # shared with the Authelia OIDC client for `kutt`
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: kutt
