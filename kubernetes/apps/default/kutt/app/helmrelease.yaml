---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Kutt 2.7.2. Node/express; the image runs `npm run migrate && npm start`, so a
# startup probe is here to cover the migration step rather than let liveness kill
# it mid-startup.
#
# Postgres rather than Kutt's SQLite default: `default` already runs a CNPG cluster
# and every other app in this namespace uses it, so this needs no PVC and the
# database lands under the existing backup + WAL archiving.
#
# Redis is required in practice. Kutt's own clients (redis.js, queues.js) are gated
# on REDIS_ENABLED, but its rate limiter builds a Redis store at startup regardless,
# so with Redis off the app dies connecting to 127.0.0.1:6379. The `dragonfly` app in
# this namespace provides it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kutt
spec:
  chartRef:
    kind: OCIRepository
    name: kutt
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kutt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: kutt/kutt
              tag: v3.2.6@sha256:fa3d24a89b04e0feb542ed7d3c77993d58dbcc1406e5291a369595d543886146
            env:
              TZ: Asia/Kolkata
              PORT: &port 3000
              SITE_NAME: Kutt
              # Kutt's startup validation requires MAIL_* to be present and exits 1
              # otherwise -- it does not care that mail is off. Nothing needs to send:
              # OIDC is the only login path and registration is disabled. Values come
              # from the shared `smtp` item via the secret.
              MAIL_ENABLED: "false"
              MAIL_HOST:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: SMTP_HOST
              MAIL_PORT:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: SMTP_PORT
              MAIL_USER:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: SMTP_USERNAME
              MAIL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: SMTP_PASSWORD
              MAIL_SECURE: "true"
              # senders are no-reply@<subdomain>.<domain>, never the app's name
              MAIL_FROM: no-reply@url.${SECRET_DOMAIN}
              # getSiteURL() builds https://<DEFAULT_DOMAIN> in production, which is
              # both the OIDC redirect base and how short URLs are rendered.
              DEFAULT_DOMAIN: url.${SECRET_DOMAIN}
              DB_CLIENT: pg
              DB_HOST: postgres-rw.default.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: kutt
              DB_USER: kutt
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: DB_PASSWORD
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: JWT_SECRET
              # Required in practice. Kutt's own clients (redis.js, queues.js) are
              # gated on this flag, but its rate limiter builds a Redis store at
              # startup regardless -- with Redis off the app dies connecting to
              # 127.0.0.1:6379. The `dragonfly` app in this namespace provides it.
              REDIS_ENABLED: "true"
              REDIS_HOST: dragonfly.default.svc.cluster.local
              REDIS_PORT: "6379"
              # The whole point: only an authenticated user may create a link, while
              # the redirect itself stays public.
              DISALLOW_ANONYMOUS_LINKS: "true"
              # No self-signup and no password form -- Authelia OIDC is the only way in.
              DISALLOW_REGISTRATION: "true"
              DISALLOW_LOGIN_FORM: "true"
              OIDC_ENABLED: "true"
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
              OIDC_CLIENT_ID: kutt
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kutt-secret
                    key: OIDC_CLIENT_SECRET
              OIDC_SCOPE: openid profile email
              OIDC_EMAIL_CLAIM: email
              OIDC_BUTTON_TEXT: Log in with Authelia
            probes:
              # `npm run migrate` runs before the server binds, so hold liveness off
              # until /api/v2/health actually answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: kutt
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["url.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # `npm run migrate` runs through @babel/register, which mkdirs its cache under
      # node_modules before the migration itself. With the rootfs read-only that
      # fails with ENOENT and the container crashloops before the server ever binds,
      # so this is the one path that has to be writable. Giving it a mount keeps
      # readOnlyRootFilesystem on rather than dropping it for the whole container.
      babelcache:
        type: emptyDir
        globalMounts:
          - path: /usr/src/app/node_modules/.cache
