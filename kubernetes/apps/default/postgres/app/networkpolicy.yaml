---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: default
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    # any pod in the default namespace (zipline)
    - from:
        - podSelector: {}
      ports:
        - port: 5432
        - port: 8000
    # the CloudNativePG operator (database namespace) manages the cluster
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
    # Prometheus (observability) scrapes metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9187
