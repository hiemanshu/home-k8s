---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
# Note the schedule is a SIX field cron (seconds included) -- it is not the
# Kubernetes CronJob format. "0 30 2 * * *" = 02:30:00 daily.
#
# The alert rules cover the failure modes this cannot: a backup that fails, and
# a backup that silently stops running.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-daily
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # take one now rather than waiting for the first window
  immediate: true
