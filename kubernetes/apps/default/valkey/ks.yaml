---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Valkey for the default namespace. Kutt needs a Redis-protocol cache + queue and
# there was none here.
#
# Valkey rather than the Dragonfly used in auth/dev: Kutt runs its visit queue on
# `bull`, which drives Redis through Lua scripts, and Dragonfly rejects scripts that
# touch keys not declared in KEYS. That is the same trap that ruled Dragonfly out for
# Immich.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app valkey
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/default/valkey/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
