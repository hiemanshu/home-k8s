---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
  ingress:
    # anything in this namespace -- Kutt is the only consumer
    - from:
        - podSelector: {}
      ports:
        - port: 6379
