---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Opengist's own secrets. The DB password is the same value the CNPG role uses (see
# default/postgres-secrets), so the connection and the role cannot drift apart.
#
# SECRET_KEY must be stable: Opengist generates a random one when unset, which would
# invalidate every session and make its encrypted MFA data unreadable on each restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opengist
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opengist-secret
    template:
      data:
        DB_URI: "postgres://opengist:{{ .DB_PASSWORD }}@postgres-rw.default.svc.cluster.local:5432/opengist"
        SECRET_KEY: "{{ .SECRET_KEY }}"
        # shared with the Authelia OIDC client for `opengist`
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: opengist
