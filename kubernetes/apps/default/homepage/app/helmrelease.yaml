---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chart:
    spec:
      chart: homepage
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: default
  interval: 1h
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    enableRbac: true
    serviceAccount:
      create: true
    controller:
      annotations:
        reloader.stakater.com/auto: "true"
    persistence:
      custom-css:
        enabled: true
        type: custom
        volumeSpec:
          configMap:
            name: homepage-custom-css
        subPath:
          - path: custom.css
            mountPath: /app/config/custom.css
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        # Homepage compares the raw Host header, port included, against this
        # comma-separated list (`src/middleware.js`) and answers 400 otherwise.
        # The service entry is Gatus, which checks Homepage against the Service
        # rather than through the gateway -- a pod reaching it by name sends
        # `homepage.default.svc.cluster.local:3000` as the Host.
        value: "home.${SECRET_DOMAIN},homepage.default.svc.cluster.local:3000"
    envFrom:
      - secretRef:
          name: homepage-widgets-secret
    config:
      kubernetes:
        mode: cluster
        gateway: true
      settingsString: |
        title: heems.dev
        theme: dark
        color: zinc
        font: plex
        headerStyle: boxed
        cardStyle: hairline
        blockStyle: refined
        statusStyle: dot
        useEqualHeights: true
        providers:
          longhorn:
            url: http://longhorn-frontend.storage.svc.cluster.local
        layout:
          Media:
          Tools:
          Monitoring:
          Dev:
          Identity:
          Infrastructure:
      widgets:
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: cluster
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - resources:
            backend: resources
            expanded: true
            cpu: true
            memory: true
        - search:
            provider: duckduckgo
            target: _blank
        - datetime:
            text_size: xl
            format:
              timeStyle: short
              dateStyle: short
        - longhorn:
            expanded: true
            total: true
            nodes: true
            labels: true
      services:
        - Media:
            - Plex:
                icon: plex.png
                href: https://plex.${SECRET_DOMAIN}
                description: Media server
            - Radarr:
                icon: radarr.png
                href: https://radarr.${SECRET_DOMAIN}
                description: Movies
                widget:
                  type: radarr
                  url: http://radarr.media.svc.cluster.local:80
                  key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
                  enableQueue: true
            - Sonarr:
                icon: sonarr.png
                href: https://sonarr.${SECRET_DOMAIN}
                description: TV
                widget:
                  type: sonarr
                  url: http://sonarr.media.svc.cluster.local:80
                  key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
                  enableQueue: true
            - Prowlarr:
                icon: prowlarr.png
                href: https://prowlarr.${SECRET_DOMAIN}
                description: Indexers
                widget:
                  type: prowlarr
                  url: http://prowlarr.media.svc.cluster.local:80
                  key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
            - SABnzbd:
                icon: sabnzbd.png
                href: https://sabnzbd.${SECRET_DOMAIN}
                description: Usenet
                widget:
                  type: sabnzbd
                  url: http://sabnzbd.media.svc.cluster.local:80
                  key: "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}"
            - qBittorrent:
                icon: qbittorrent.png
                href: https://downloads.${SECRET_DOMAIN}
                description: Torrents
                widget:
                  type: qbittorrent
                  url: http://qbittorrent.media.svc.cluster.local:8080
                  # no webui auth: the image whitelists 10.0.0.0/8, so the
                  # widget reaches the API without credentials (authelia gates
                  # the ui itself)
            - Bazarr:
                icon: bazarr.png
                href: https://bazarr.${SECRET_DOMAIN}
                description: Subtitles
                widget:
                  type: bazarr
                  url: http://bazarr.media.svc.cluster.local:6767
                  key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
            - Immich:
                icon: immich.png
                href: https://photos.${SECRET_DOMAIN}
                description: Photo library
                widget:
                  type: immich
                  version: 2
                  url: http://immich-server.media.svc.cluster.local:2283
                  key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
        - Tools:
            - Zipline:
                icon: zipline.png
                href: https://share.${SECRET_DOMAIN}
                description: File uploads & share links
            - OpenCloud:
                icon: opencloud.png
                href: https://files.${SECRET_DOMAIN}
                description: Files & shares
            - Kutt:
                icon: kutt.png
                href: https://url.${SECRET_DOMAIN}
                description: URL shortener
            - Opengist:
                icon: opengist.png
                href: https://paste.${SECRET_DOMAIN}
                description: Pastebin
        - Monitoring:
            - Grafana:
                icon: grafana.png
                href: https://grafana.${SECRET_DOMAIN}
                description: Metrics & logs
                widget:
                  type: grafana
                  # Basic auth, not a token: the widget has no token field, and it reads
                  # /api/admin/stats so the account has to be Admin. Basic auth is
                  # deliberately still enabled in grafana.ini for the sidecars, and the
                  # grafana NetworkPolicy already allows this namespace on 3000.
                  url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local:80
                  username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
                  password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
                  # version/alerts left at their defaults: v1 tries Grafana's own alert
                  # rules and falls back to the Alertmanager datasource. If the alerts
                  # tile errors while dashboards and datasources are fine, set
                  # `version: 2` plus `alerts:` to the Alertmanager datasource's name.
            - Gatus:
                icon: gatus.png
                href: https://status.${SECRET_DOMAIN}
                description: Service status
                widget:
                  type: gatus
                  # the service, not the route: Gatus's API is unauthenticated
                  # inside the cluster, while the card links to the Authelia-gated
                  # UI. No NetworkPolicy on Gatus yet, so this reaches it.
                  url: http://gatus.observability.svc.cluster.local:8080
            - KubeVirt Manager:
                icon: kubevirt.png
                href: https://virt.${SECRET_DOMAIN}
                description: Virtual machines
        - Dev:
            - Forgejo:
                icon: forgejo.png
                href: https://git.${SECRET_DOMAIN}
                description: Git forge
                widget:
                  type: gitea
                  url: http://forgejo-http.dev.svc.cluster.local:3000
                  key: "{{HOMEPAGE_VAR_FORGEJO_TOKEN}}"
            - Mirror:
                icon: gitea.png
                href: https://mirror.${SECRET_DOMAIN}
                description: GitHub → Forgejo mirror
        - Identity:
            - Authelia:
                icon: authelia.png
                href: https://auth.${SECRET_DOMAIN}
                description: SSO portal
            - LLDAP:
                icon: lldap.png
                href: https://users.${SECRET_DOMAIN}
                description: Users & groups
        - Infrastructure:
            - Longhorn:
                icon: longhorn.png
                href: https://longhorn.${SECRET_DOMAIN}
                description: Storage
            - ntfy:
                icon: ntfy.png
                href: https://notify.${SECRET_DOMAIN}
                description: Push notifications
                widget:
                  type: ntfy
                  url: https://notify.${SECRET_DOMAIN}
                  topic: alerts
                  key: "{{HOMEPAGE_VAR_NTFY_TOKEN}}"
            - AdGuard:
                icon: adguard-home.png
                href: http://192.168.69.101
                description: DNS
                widget:
                  type: adguard
                  url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
                  username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
                  password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
