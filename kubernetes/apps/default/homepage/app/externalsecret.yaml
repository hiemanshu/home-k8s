---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-widgets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-widgets-secret
  data:
    - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
    - secretKey: HOMEPAGE_VAR_PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: PROWLARR_API_KEY
    - secretKey: HOMEPAGE_VAR_SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd
        property: SABNZBD_API_KEY
    # Forgejo widget needs read:notification + read:issue + read:repository
    # (the gitea-mirror token only has write:repository/write:organization)
    - secretKey: HOMEPAGE_VAR_FORGEJO_TOKEN
      remoteRef:
        key: homepage
        property: FORGEJO_TOKEN
    # ntfy widget: latest message on the 'alerts' topic
    - secretKey: HOMEPAGE_VAR_NTFY_TOKEN
      remoteRef:
        key: notify
        property: PUBLISH_TOKEN
    # immich widget (api key with server.statistics permission)
    - secretKey: HOMEPAGE_VAR_IMMICH_API_KEY
      remoteRef:
        key: homepage
        property: IMMICH_API_KEY
    # qbittorrent widget (Options > WebUI > Authentication > API Key)
    - secretKey: HOMEPAGE_VAR_QBITTORRENT_API_KEY
      remoteRef:
        key: homepage
        property: QBITTORRENT_API_KEY
    # adguard widget (reuse the adguard item)
    - secretKey: HOMEPAGE_VAR_ADGUARD_URL
      remoteRef:
        key: adguard
        property: URL
    - secretKey: HOMEPAGE_VAR_ADGUARD_USER
      remoteRef:
        key: adguard
        property: USER
    - secretKey: HOMEPAGE_VAR_ADGUARD_PASSWORD
      remoteRef:
        key: adguard
        property: PASSWORD
