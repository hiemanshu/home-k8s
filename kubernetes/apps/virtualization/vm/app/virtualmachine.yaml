---
# A throwaway Ubuntu VM, mostly to prove the chain end to end: the disk lands on
# longhorn-vm, the VM boots, and the backup runs. Copy this file to add another.
#
# runStrategy rather than the deprecated `running` field.
#
# cloud-init pulls SSH keys straight from GitHub rather than a password, so there
# is no credential anywhere in git or in 1Password. Swap it for a password out of
# 1Password if you would rather log in with one.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test1
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: test1
    spec:
      # All VMs live on gandalf for now. The disk's replica does not have to be
      # there -- longhorn-vm is best-effort, so the volume attaches from wherever
      # the VM runs.
      nodeSelector:
        kubernetes.io/hostname: gandalf
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        # the VM controller holds the VM back until the import reaches Succeeded
        - name: rootdisk
          dataVolume:
            name: test1
        - name: cloudinit
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              runcmd:
                - mkdir -p /home/ubuntu/.ssh
                - curl -fsSL https://github.com/hiemanshu.keys >> /home/ubuntu/.ssh/authorized_keys
                - chown -R ubuntu:ubuntu /home/ubuntu/.ssh
                - chmod 700 /home/ubuntu/.ssh
                - chmod 600 /home/ubuntu/.ssh/authorized_keys
