---
# The VM's disk. CDI pulls the containerdisk image and writes the OS onto a PVC
# named after this object, so there is exactly one PVC per VM.
#
# The dated tag is a containerdisks build snapshot -- containerdisks never
# republish one, so it pins as effectively as a digest would, without making CDI
# resolve an architecture out of a manifest list.
#
# storageClassName is set explicitly *and* longhorn-vm carries
# storageclass.kubevirt.io/is-default-virt-class, which is what makes future
# DataVolumes pick the fast single-replica class without being told. Belt and
# braces: if the annotation ever goes missing, this one still lands correctly.
#
# 100Gi, down from the 256Gi first asked for. Longhorn schedules by declared
# size, not by bytes written: with over-provisioning at 100% it will only promise
# what the disk has left after every scheduled replica, which on gandalf was ~222Gi
# when the 256Gi request sat Pending with "did not have enough free storage". A
# Godot checkout plus editor and template builds is tens of GiB, and the class
# allows expansion if that ever changes.
#
# pullMethod: node pulls the containerdisk through the node's container runtime
# instead of an importer pod, so CDI needs no scratch volume. The default (pod)
# wants scratch space the same size as the target, on the same class and node,
# which would have doubled what Longhorn has to find during the import.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: godot-build
spec:
  source:
    registry:
      url: "docker://quay.io/containerdisks/ubuntu:26.04-2610230208"
      pullMethod: node
  storage:
    storageClassName: longhorn-vm
    resources:
      requests:
        storage: 100Gi
