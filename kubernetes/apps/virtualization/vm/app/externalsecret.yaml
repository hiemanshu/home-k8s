---
# Restic credentials for this VM's disk, from the same shared 1Password item the
# volsync component uses for every other app -- no new bucket, no new credential
# item, no Longhorn backup target to configure.
#
# Each VM gets its own repository path. Several ReplicationSources sharing one
# restic repo would contend on its locks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test1-volsync-minio
spec:
  dataFrom:
    - extract:
        key: volsync
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: test1-volsync-minio-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}/test1"
