---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The VMs themselves. One Flux Kustomization for all of them, so a VM's disk PVC
# and the backup that covers it are declared in the same place and cannot drift
# apart.
#
# Depends on cdi for the DataVolume CRD, and longhorn for the volume behind it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vm
  namespace: &namespace virtualization
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cdi
      namespace: virtualization
    - name: longhorn
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/virtualization/vm/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
