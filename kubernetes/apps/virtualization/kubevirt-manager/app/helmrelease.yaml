---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# A Go backend with a bundled nginx frontend, which is why it needs
# /var/cache/nginx and /var/run writable even with a read-only root filesystem.
# It talks to the kube-apiserver using its ServiceAccount token.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevirt-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubevirt-manager
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: kubevirt-manager
    global:
      createDefaultServiceAccount: false
    serviceAccount:
      kubevirt-manager: {}
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        fsGroup: 30000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      kubevirt-manager:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/kubevirtmanager/kubevirt-manager
              tag: 1.5.4@sha256:1b98f1b5977a336c2dcd8b0e623f8343a70ff378bfa5ec094994fd4f68b100eb
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: kubevirt-manager
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["virt.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/nginx
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
