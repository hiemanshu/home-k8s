---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volsync-unlock
spec:
  # Daily, offset from the top of the hour so it does not coincide with a backup run.
  # `restic unlock` only removes locks older than 30m, so it is safe alongside live backups.
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: volsync-unlock
        spec:
          restartPolicy: OnFailure
          serviceAccountName: volsync-unlock
          initContainers:
            # Discover every restic repository from the deployed ReplicationSources,
            # so new apps are covered automatically. The repository path is the sourcePVC name.
            - name: discover
              image: docker.io/alpine/k8s:1.36.5
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  kubectl get replicationsources.volsync.backube --all-namespaces \
                    -o jsonpath='{range .items[*]}{.spec.sourcePVC}{"\n"}{end}' \
                    | sort -u > /shared/apps
                  echo "repositories:"
                  cat /shared/apps
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: shared
                  mountPath: /shared
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: unlock
              image: docker.io/restic/restic:0.19.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  fail=0
                  while read -r app; do
                    [ -n "$app" ] || continue
                    echo "== unlocking ${app} =="
                    if ! restic --no-cache -r "${RESTIC_REPOSITORY}/${app}" unlock; then
                      echo "unlock failed: ${app}"
                      fail=1
                    fi
                  done < /shared/apps
                  exit "$fail"
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: volsync-unlock-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: shared
                  mountPath: /shared
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: shared
              emptyDir: {}
            - name: tmp
              emptyDir: {}
