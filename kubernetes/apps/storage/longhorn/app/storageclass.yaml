---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cache
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  dataLocality: disabled
  numberOfReplicas: "1"
---
# `longhorn-vm` is deliberately ABSENT here, temporarily.
#
# StorageClass `parameters` really are immutable -- `field is immutable` from the API,
# enforced by declarative validation on the registry strategy rather than by
# ValidateStorageClassUpdate, which only checks metadata. Changing dataLocality in place
# therefore fails the whole `longhorn` Kustomization, and everything that dependsOn it
# (snapshot-controller, volsync, the media apps, opencloud, obsidian-couchdb, gatus)
# stays NotReady behind it.
#
# So it comes out of git for one commit: Flux prunes the existing object, `longhorn`
# applies cleanly, and the next commit re-adds it with the wanted parameters -- a fresh
# create rather than a rejected update. Nothing references it in the meantime: the only
# VM disk was deleted with the test1 app, and CDI falls back if its scratch class is
# missing.
#
# Note for next time: this is the repo's own documented trap. Deleting and recreating is
# the fix, and a plain apply never will be.
