---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cache
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  dataLocality: disabled
  numberOfReplicas: "1"
---
# VM disks: one replica, kept on the node the VM runs on. Deliberately not the
# 3-replica default -- these are mostly test VMs, and the accepted trade-off is that
# losing a node loses that node's VMs until they are restored from backup. Nothing
# needs live migration, so single-copy local data is the right call, and keeping the
# replica on the VM's own node avoids a network hop on every read.
#
# WaitForFirstConsumer is required here, not cosmetic: with dataLocality:
# strict-local the volume must be created on the node the pod will run on, and only
# the scheduler knows which that is. longhorn-cache above is Immediate because a
# volsync cache has no such constraint.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-vm
  annotations:
    # CDI prefers this over the cluster default when a DataVolume omits
    # storageClassName, so new VM disks land on the fast single-replica class
    # without every DataVolume having to say so.
    storageclass.kubevirt.io/is-default-virt-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  # `strict-local`, not `strict`. Longhorn 1.11 accepts only disabled, best-effort
  # and strict-local, and an unknown value makes volume creation fail validation --
  # the PVC never binds and every consumer waits forever on a volume that will never
  # exist. strict-local requires numberOfReplicas 1, which is set below.
  dataLocality: strict-local
  numberOfReplicas: "1"
