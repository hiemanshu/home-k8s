---
# S3 connection details for in-cluster consumers, sourced from 1Password so the
# endpoint lives in exactly one place -- it is the value that changes when the S3
# API moves in-cluster. Exposed through the cluster-wide postBuild.substituteFrom
# (see kubernetes/flux/cluster/ks.yaml), so manifests write ${S3_ENDPOINT} and
# ${S3_BUCKET} instead of hardcoding them.
#
# Only the location is emitted here, not the credentials: the items that need
# keys pull them directly, so this Secret stays non-sensitive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: s3-secrets
    template:
      data:
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
  dataFrom:
    - extract:
        key: cnpg
