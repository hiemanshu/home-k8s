---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system

components:
  - ../../components/sops

resources:
  - ./namespace.yaml
  - ./flux-instance/ks.yaml
  - ./flux-operator/ks.yaml
  # creates the Secret that every Kustomization substitutes from, so it has to
  # exist before the rest reconcile
  - ./s3-secrets/ks.yaml
