---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# VueTorrent runs as its own app: vuetorrent-backend serves the UI (mounted from
# an image volume) and proxies the qBittorrent API, so qBittorrent's own WebUI
# stays in-cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vuetorrent
spec:
  chartRef:
    kind: OCIRepository
    name: vuetorrent
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vuetorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # image volumes need user namespaces
          hostUsers: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: ghcr.io/vuetorrent/vuetorrent-backend
              tag: 2.7.3@sha256:9e81304f91116961f07f0a85c5db5e2cbef2fcd6d86d3d5278f5508af41ed670
            env:
              # UI comes from the image volume; disables the GitHub updater
              RELEASE_TYPE: none
              PORT: &port 8080
              QBIT_BASE: http://qbittorrent.media.svc.cluster.local:8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /backend/ping
                    port: *port
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 200Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: vuetorrent
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["downloads.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # the built UI, shipped as an image volume (no init/zip/apk)
      vuetorrent:
        type: image
        image: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.36.1@sha256:2750543ce2f9868e12bca941482431eb59b5517e89c2538cb2229124aa79d2c2
        globalMounts:
          - path: /vuetorrent
      config:
        existingClaim: vuetorrent
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
