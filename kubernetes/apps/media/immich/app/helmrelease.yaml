---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # shared across all immich components
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
            env:
              # Immich's BullMQ queue needs real Redis/Valkey semantics;
              # Dragonfly rejects its Lua scripts ("undeclared key"). The chart
              # bundles valkey, so leave REDIS_HOSTNAME at the chart default.
              DB_HOSTNAME: postgres-rw.media.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: db-password
    server:
      enabled: true
    machine-learning:
      enabled: true
      # run ONLY on the node with the Intel iGPU
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.1-openvino@sha256:9f5ea923b763435592280e2f5e051a62f1a33d6d14e87620fc15453c27a12ae0
              resources:
                limits:
                  gpu.intel.com/i915: 1
    # bundled valkey (real Redis semantics) -- Immich/BullMQ does not work on Dragonfly
    valkey:
      enabled: true
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich
