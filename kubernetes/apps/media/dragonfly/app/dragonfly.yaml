---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  replicas: 1
  # static filename so snapshots don't accumulate on disk;
  # cap proactor threads (Dragonfly defaults to host CPU count -> needs 256MiB/thread)
  args:
    - --dbfilename=dump
    - --proactor_threads=2
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      # CPU limit bounds the cgroup quota, which Dragonfly uses to size its
      # thread pool; without it, it defaults to host CPUs (80) and demands 20GiB.
      cpu: "2"
      memory: 1Gi
  snapshot:
    cron: "*/30 * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
