---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
  policyTypes:
    - Ingress
  ingress:
    # any pod in the media namespace (immich)
    - from:
        - podSelector: {}
      ports:
        - port: 6379
        - port: 9999
    # the Dragonfly operator (database namespace) manages the instance
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
    # Prometheus (observability) scrapes metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9999
