---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          vuetorrent:
            image:
              repository: docker.io/alpine
              tag: "3.22"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                V=2.36.1
                D=/config/qBittorrent/vuetorrent
                if [ "$(cat "$D/.version" 2>/dev/null || true)" = "$V" ]; then
                  echo "vuetorrent $V already present"; exit 0
                fi
                apk add --no-cache curl unzip ca-certificates >/dev/null
                mkdir -p "$D"
                curl -fsSL "https://github.com/VueTorrent/VueTorrent/releases/download/v$V/vuetorrent.zip" -o /tmp/vt.zip
                unzip -oq /tmp/vt.zip -d "$D"
                echo "$V" > "$D/.version"
                chown -R 568:568 "$D"
            securityContext:
              # apk needs root; the files are chowned to 568 afterwards.
              # container-level runAsNonRoot:false overrides the pod-level true.
              runAsUser: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.4
            env:
              TZ: Asia/Kolkata
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # same uid/gid as the *arr apps so NAS files line up
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["downloads.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: qbittorrent
        globalMounts:
          - path: /config
      # same NFS tree the *arr apps mount, so paths/hardlinks match
      media:
        type: nfs
        server: 192.168.69.12
        path: /data
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
