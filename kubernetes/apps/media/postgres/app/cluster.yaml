---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# NOTE: immich needs the `vchord` extension, so this cluster differs from our
# others: pg18 base image + the vchord extension image (CNPG "extension images").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  storage:
    storageClass: longhorn
    size: 10Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  monitoring:
    # deprecated flag; we manage the PodMonitor ourselves (podmonitor.yaml)
    enablePodMonitor: false
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  bootstrap:
    initdb:
      database: app
      owner: app
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        passwordSecret:
          name: immich-db-password
