---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: intel-device-plugins-operator
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.34.1
  # Intel's own OCI registry. This used to pull from
  # ghcr.io/home-operations/charts-mirror, which no longer serves these two
  # packages at all -- anonymous token requests for them return 403 while the
  # mirror's other charts still answer 200, so every pull of every version failed.
  url: oci://ghcr.io/intel/helm-charts/intel-device-plugins-operator
