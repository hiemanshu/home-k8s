---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Standard CouchDB environment variable names, so the container can just envFrom
# this Secret. Reuses the existing `couchdb` 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-couchdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: obsidian-couchdb-secret
    template:
      data:
        COUCHDB_USER: "{{ .ADMIN_USERNAME }}"
        COUCHDB_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        COUCHDB_SECRET: "{{ .COOKIE_AUTH_SECRET }}"
        COUCHDB_ERLANG_COOKIE: "{{ .COOKIE_AUTH_SECRET }}"
  dataFrom:
    - extract:
        key: couchdb
