---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# CouchDB for Obsidian LiveSync, built with app-template rather than the
# apache/couchdb chart. Why: that chart creates its own PVC via the StatefulSet's
# volumeClaimTemplates, which (a) makes components/volsync impossible, since the
# component has to own the PVC it backs up, and (b) ties any backup to a
# chart-internal volume name ('database-storage-couchdb-couchdb-0') that a chart
# upgrade could change out from under it, silently stopping backups.
#
# Config comes from the upstream LiveSync server config, mounted into local.d.
# CouchDB's own docs: etc/default.ini, etc/default.d/*.ini, etc/local.ini,
# etc/local.d/*.ini are merged.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-couchdb
spec:
  chartRef:
    kind: OCIRepository
    name: obsidian-couchdb
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      obsidian-couchdb:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 5984
            runAsGroup: 5984
            fsGroup: 5984
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        containers:
          app:
            image:
              repository: docker.io/library/couchdb
              tag: 3.5.3@sha256:3611ce43bd32fe2368997fd41ec6e7270ec8d84aa5fc13c9828e5b15fd6bafe8
            envFrom:
              - secretRef:
                  name: obsidian-couchdb-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_up
                    port: &port 5984
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # Deliberately NOT readOnlyRootFilesystem: the official image's
              # entrypoint writes into /opt/couchdb/etc at startup. The data volume
              # and the config mount cover everything else it needs.
    service:
      app:
        controller: obsidian-couchdb
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: obsidian-couchdb-configmap
        globalMounts:
          # Mounted as a single FILE, not over the directory. The official
          # entrypoint runs `touch /opt/couchdb/etc/local.d/docker.ini` under
          # `set -e` ("this is where runtime configuration changes will be
          # written"), so that directory must stay writable -- mounting the
          # ConfigMap over the whole of local.d makes it read-only and kills the
          # container at startup. The file itself can be read-only.
          - path: /opt/couchdb/etc/local.d/config.ini
            subPath: config.ini
      data:
        existingClaim: obsidian-couchdb
        advancedMounts:
          obsidian-couchdb:
            app:
              - path: /opt/couchdb/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
