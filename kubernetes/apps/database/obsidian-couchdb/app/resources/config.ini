; CouchDB configuration required by Obsidian LiveSync.
; Mirrors upstream vrtmrz/self-hosted-livesync-server conf/local.ini, plus the
; fixed uuid we have always used. single_node=true is what makes CouchDB create
; its system databases (_users, _replicator, _global_changes) on a fresh volume --
; the apache chart did that in a job, which we no longer have.

[couchdb]
single_node = true
max_document_size = 50000000
uuid = 14b2bf86-d3fd-4e25-a24b-789173dc7a1f

[chttpd]
require_valid_user = true
bind_address = any
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
