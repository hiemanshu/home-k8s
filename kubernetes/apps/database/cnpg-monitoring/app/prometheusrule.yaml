---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Backup alerting. The Alertmanager root route already sends everything to ntfy,
# so no labels are needed -- and Prometheus selects every PrometheusRule in the
# cluster (ruleSelectorNilUsesHelmValues: false).
#
# WHY THERE IS NO "no recent backup" RULE HERE:
#
# cnpg_collector_last_available_backup_timestamp still exists on the endpoint but
# reads 0 on a cluster with a completed base backup -- the operator no longer
# populates it now that a CNPG-I plugin owns backups, and the plugin's own metrics
# are not exposed by the release manifest (its Deployment has no metrics port, and
# barman-plugin-metrics-reader has no binding). A rule guarded by `> 0` would never
# fire, and an unguarded one would fire forever.
#
# The real state is in ObjectStore.status.serverRecoveryWindow
# (lastSuccessfulBackupTime / lastFailedBackupTime / firstRecoverabilityPoint).
# That rule gets written once the plugin's metrics are exposed and scraped.
#
# The failure metric below IS still populated -- it moved at 10:52 for a real
# failed attempt -- so "a backup failed recently" is expressible correctly.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backups
spec:
  groups:
    - name: cnpg.backups
      rules:
        # "A failure in the last 24h", NOT "the last failure is newer than the last
        # success". The latter is always true here because the success metric is 0,
        # so it would fire forever. A cluster that has never failed reports 0, and
        # time() - 0 is huge, so this stays quiet until something actually breaks.
        - alert: CNPGBackupFailed
          expr: |
            time() - cnpg_collector_last_failed_backup_timestamp < 86400
              and cnpg_collector_last_failed_backup_timestamp > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              CNPG backup failed in the last 24h ({{ $labels.namespace }}/{{ $labels.cluster }})

        # A healthy cluster keeps this at or near zero: WAL segments waiting to be
        # archived. Sustained growth means the point-in-time recovery window is
        # silently shrinking. Verified against a live endpoint.
        - alert: CNPGWalArchivingStalled
          expr: |
            cnpg_collector_pg_wal_archive_status{value="ready"} > 5
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: >-
              CNPG WAL archiving stalled ({{ $labels.namespace }}/{{ $labels.cluster }})
            description: >-
              WAL segments are accumulating unarchived, so the point-in-time
              recovery window is shrinking.
