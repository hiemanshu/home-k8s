---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Backup alerting. The Alertmanager root route already sends everything to ntfy,
# so no labels are needed -- and Prometheus selects every PrometheusRule in the
# cluster (ruleSelectorNilUsesHelmValues: false).
#
# WHY THERE IS NO "backup failed" OR "no recent backup" RULE HERE:
#
# cnpg_collector_last_available_backup_timestamp and
# cnpg_collector_last_failed_backup_timestamp still exist on the metrics endpoint
# but are marked Deprecated, and the operator no longer populates them once a
# CNPG-I plugin owns backups. Measured on a cluster with a completed base backup
# in the object store:
#
#   cnpg_collector_last_available_backup_timestamp 0            <- zero
#   cnpg_collector_last_failed_backup_timestamp    <stale value>
#
# So a "no recent backup" rule guarded by `> 0` can never fire, and an unguarded
# "last failure is newer than last success" rule fires forever. Both are worse
# than having no rule, because they look like coverage.
#
# The real state lives in the plugin: ObjectStore.status.serverRecoveryWindow
# carries lastSuccessfulBackupTime / lastFailedBackupTime / firstRecoverabilityPoint.
# Those rules get written once the plugin's metric names are confirmed by
# scraping its endpoint -- guessing them is what produced the above.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backups
spec:
  groups:
    - name: cnpg.backups
      rules:
        # A healthy cluster keeps this at or near zero: WAL segments waiting to be
        # archived. Sustained growth means the point-in-time recovery window is
        # silently shrinking. Verified against a live endpoint.
        - alert: CNPGWalArchivingStalled
          expr: |
            cnpg_collector_pg_wal_archive_status{value="ready"} > 5
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: >-
              CNPG WAL archiving stalled ({{ $labels.namespace }}/{{ $labels.cluster }})
            description: >-
              WAL segments are accumulating unarchived, so the point-in-time
              recovery window is shrinking.
