---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# the couchdb chart reads its admin credentials from a Secret named
# `<release>-couchdb` (release = couchdb) with these exact keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: couchdb-couchdb
    template:
      data:
        adminUsername: "{{ .ADMIN_USERNAME }}"
        adminPassword: "{{ .ADMIN_PASSWORD }}"
        cookieAuthSecret: "{{ .COOKIE_AUTH_SECRET }}"
        # the chart's statefulset actually reads `erlangCookie`
        erlangCookie: "{{ .COOKIE_AUTH_SECRET }}"
  dataFrom:
    - extract:
        key: couchdb
