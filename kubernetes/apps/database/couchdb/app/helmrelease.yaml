---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
spec:
  chart:
    spec:
      chart: couchdb
      version: 4.6.3
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: database
  interval: 1h
  values:
    # single node
    clusterSize: 1
    allowAdminParty: false
    # credentials come from the ExternalSecret (couchdb-couchdb)
    createAdminSecret: false
    adminUsername: admin
    # couchdb requires a fixed cluster uuid for single-node installs
    couchdbConfig:
      couchdb:
        uuid: 3d5512b9-aadd-4d4a-9ce2-d97fbb62129b
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    service:
      type: ClusterIP
      externalPort: 5984
      targetPort: 5984
    # Obsidian LiveSync (and its "check server requirements") talks to it over
    # the browser request API, so allow CORS.
    enableCORS: true
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
