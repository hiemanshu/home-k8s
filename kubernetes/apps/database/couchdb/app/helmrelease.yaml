---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: couchdb
spec:
  chart:
    spec:
      chart: couchdb
      version: 4.6.3
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: database
  interval: 1h
  values:
    # single node
    clusterSize: 1
    allowAdminParty: false
    # credentials come from the ExternalSecret (couchdb-couchdb); with
    # createAdminSecret: false the chart reads them all from that Secret, so
    # there's no adminUsername/adminPassword here to drift.
    createAdminSecret: false
    # restart when the admin secret changes (reloader watches referenced secrets)
    annotations:
      reloader.stakater.com/auto: "true"
    # couchdb requires a fixed cluster uuid for single-node installs; the rest
    # are the settings Obsidian LiveSync's "check server requirements" wants.
    couchdbConfig:
      couchdb:
        uuid: 14b2bf86-d3fd-4e25-a24b-789173dc7a1f
        max_document_size: "50000000"
      chttpd:
        require_valid_user: "true"
        enable_cors: "true"
        max_http_request_size: "4294967296"
      httpd:
        WWW-Authenticate: 'Basic realm="administrator"'
      cors:
        credentials: "true"
        origins: "app://obsidian.md,capacitor://localhost,http://localhost"
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    service:
      type: ClusterIP
      externalPort: 5984
      targetPort: 5984
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
