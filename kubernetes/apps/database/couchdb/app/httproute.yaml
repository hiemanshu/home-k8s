---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Obsidian LiveSync can't do browser SSO -- it authenticates with per-user
# CouchDB credentials, and mobile requires a valid TLS cert, so this is public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: couchdb
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "notes.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: couchdb-svc-couchdb
          port: 5984
      timeouts:
        request: 300s
