---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-dns-external
spec:
  chartRef:
    kind: OCIRepository
    name: adguard-dns-external
  interval: 1h
  install:
    remediation:
      retries: -1
  values:
    fullnameOverride: adguard-dns-external
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: password
    extraArgs:
      # the webhook provider API listens on the sidecar's localhost:8888
      - --webhook-provider-url=http://localhost:8888
      # external routes only; adguard-dns-internal handles envoy-internal.
      - --gateway-name=envoy-external
      # Same reasoning as adguard-dns-internal: with the Gateway's
      # `external.<domain>` target (which Cloudflare needs, because the public
      # path goes through the tunnel) every record was a CNAME, and AdGuard
      # resolves a CNAME target against its upstreams rather than its own
      # rewrites -- so it answered "CNAME + NXDOMAIN" and Windows could not
      # follow it. The VIP gives AdGuard an A record it can answer directly.
      #
      # This override lives here rather than on the Gateway so Cloudflare keeps
      # `external.<domain>`: the public path genuinely needs the tunnel name.
      - --default-targets=192.168.69.4
      - --force-default-targets
    # gateway-httproute only: do NOT mirror DNSEndpoints (the cloudflare tunnel
    # owns `external.<domain>`)
    sources: ["gateway-httproute"]
    policy: sync
    txtPrefix: k8s.
    txtOwnerId: adguard-external
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-secret
