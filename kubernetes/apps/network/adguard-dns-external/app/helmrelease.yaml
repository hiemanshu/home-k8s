---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-dns-external
spec:
  chartRef:
    kind: OCIRepository
    name: adguard-dns-external
  interval: 1h
  install:
    remediation:
      retries: -1
  values:
    fullnameOverride: adguard-dns-external
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: password
    extraArgs:
      # the webhook provider API listens on the sidecar's localhost:8888
      - --webhook-provider-url=http://localhost:8888
      # external routes only; adguard-dns-internal handles envoy-internal. AdGuard gets
      # `<app> -> CNAME external.<domain>` which resolves locally to the
      # envoy-external IP.
      - --gateway-name=envoy-external
    # gateway-httproute only: do NOT mirror DNSEndpoints (the cloudflare tunnel
    # owns `external.<domain>`)
    sources: ["gateway-httproute"]
    policy: sync
    txtPrefix: k8s.
    txtOwnerId: adguard-external
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-secret
