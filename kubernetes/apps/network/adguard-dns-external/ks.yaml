---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adguard-dns-external
spec:
  dependsOn:
    - name: adguard-dns
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/adguard-dns-external/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
