---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: adguard-secret
    template:
      data:
        url: "{{ .URL }}"
        username: "{{ .USER }}"
        password: "{{ .PASSWORD }}"
  dataFrom:
    - extract:
        key: adguard
