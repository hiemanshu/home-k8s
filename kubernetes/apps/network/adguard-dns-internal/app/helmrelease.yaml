---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-dns-internal
spec:
  chartRef:
    kind: OCIRepository
    name: adguard-dns-internal
  interval: 1h
  install:
    remediation:
      retries: -1
  values:
    fullnameOverride: adguard-dns-internal
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: password
    extraArgs:
      # the webhook provider API listens on the sidecar's localhost:8888
      - --webhook-provider-url=http://localhost:8888
      # internal routes only (Cloudflare instance handles envoy-external)
      - --gateway-name=envoy-internal
      # AdGuard resolves a CNAME rewrite's target against its UPSTREAMS, not
      # against its own rewrites. With the Gateway's `internal.<domain>` target
      # every app record was therefore a CNAME to a LAN-only name, and AdGuard
      # answered "CNAME + NXDOMAIN": it applied the rewrite, then failed to
      # resolve the target upstream and passed the NXDOMAIN through.
      #
      # macOS and Linux ignore the rcode and re-query the target themselves, so
      # this looked healthy for months. Windows and nslookup treat NXDOMAIN as
      # final, so EVERY ${SECRET_DOMAIN} name failed there. Go's resolver is
      # strict too, which puts in-cluster OIDC token exchanges at risk.
      #
      # Pointing at the VIP makes AdGuard write A records, which it answers from
      # its own rewrite: A + NOERROR, AAAA + NOERROR/empty, and no CNAME in the
      # chain. The VIP is pinned by LB-IPAM, so it is as stable as the name was.
      - --default-targets=192.168.69.3
      - --force-default-targets
    policy: sync
    # gateway-httproute only: do NOT read DNSEndpoints, or we'd mirror the
    # cloudflare tunnel's `external.<domain>` CNAME and clobber the local name
    sources: ["gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: adguard
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-secret
