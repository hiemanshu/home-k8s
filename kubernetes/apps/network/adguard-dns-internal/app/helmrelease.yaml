---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-dns-internal
spec:
  chartRef:
    kind: OCIRepository
    name: adguard-dns-internal
  interval: 1h
  install:
    remediation:
      retries: -1
  values:
    fullnameOverride: adguard-dns-internal
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: username
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: adguard-secret
                key: password
    extraArgs:
      # the webhook provider API listens on the sidecar's localhost:8888
      - --webhook-provider-url=http://localhost:8888
      # internal routes only (Cloudflare instance handles envoy-external)
      - --gateway-name=envoy-internal
    policy: sync
    # gateway-httproute only: do NOT read DNSEndpoints, or we'd mirror the
    # cloudflare tunnel's `external.<domain>` CNAME and clobber the local name
    sources: ["gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: adguard
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: adguard-secret
