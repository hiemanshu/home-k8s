---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ntfy-secret
    template:
      data:
        NTFY_AUTH_USERS: "{{ .AUTH_USERS }}"
        NTFY_AUTH_TOKENS: "{{ .AUTH_TOKENS }}"
  dataFrom:
    - extract:
        key: notify
