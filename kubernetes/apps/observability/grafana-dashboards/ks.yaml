---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Grafana dashboards, as ConfigMaps the kube-prometheus-stack dashboard sidecar picks
# up by label (grafana_dashboard: "1"). Chart-less app dir: there is no HelmRelease
# here, just manifests -- like database/cnpg-monitoring.
#
# The chart already ships the standard set (node, pods, API server...), so this is only
# for the app-specific gaps: CNPG backups, and whatever else we vendor.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-dashboards
  namespace: &namespace observability
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kube-prometheus-stack
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-dashboards/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
