---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    # Alloy pushes logs from the same namespace. Loki has no route, so nothing
    # outside observability needs to reach it.
    - from:
        - podSelector: {}
      ports:
        - port: 3100
        - port: 9095
