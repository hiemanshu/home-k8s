---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: authelia
        property: GRAFANA_OAUTH_CLIENT_SECRET
  target:
    name: grafana-oauth
---
# Grafana's admin credentials, rendered as a Helm values fragment rather than env vars.
# See the valuesFrom comment on the HelmRelease for why it is not
# GF_SECURITY_ADMIN_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-admin
    template:
      data:
        # Flux's valuesFrom reads this key by default
        values.yaml: |
          grafana:
            adminUser: "{{ .USER }}"
            adminPassword: "{{ .PASSWORD }}"
  dataFrom:
    - extract:
        key: grafana
