---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    # Grafana queries it; Alertmanager and the operator are in the same namespace.
    - from:
        - podSelector: {}
      ports:
        - port: 9090
