---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # CRDs seeded at bootstrap (00-crds.yaml); Flux keeps them current via the
    # global crds: CreateReplace patch, so keep the chart's `crds` subchart enabled.
    crds:
      enabled: true
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        # trust the reverse-proxy (Authelia) header so there is no second login
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
    # Talos does not expose these control-plane components for scraping
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 30d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
