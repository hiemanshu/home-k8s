---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    # NOTE: no `serverSideApply` override here -- this release uses Helm's default
    # (server-side apply), like every other release in the repo.
    #
    # It was briefly set to `disabled` to get out of a hole, and that history is worth
    # knowing because the trap can come back:
    #
    #   Helm now defaults to SSA, and under SSA a `null` only means "this manager does
    #   not own this field" -- it does not delete it. When a previous release's manager
    #   owned the API-defaulted `rollingUpdate`, the null did nothing, the object stayed
    #   invalid, and every upgrade failed with:
    #     spec.strategy.rollingUpdate: Forbidden: may not be specified when strategy
    #     `type` is 'Recreate'
    #   A 3-way strategic merge patch treats null as delete, which is why `disabled`
    #   worked. It is only needed while some manager still owns the field.
    #
    # If that error ever returns, the fix is the same one-off: set `serverSideApply:
    # disabled` for one upgrade, then put it back.
  valuesFrom:
    # Grafana's admin credentials as a Helm values fragment, from 1Password.
    #
    # Deliberately the adminPassword VALUE rather than GF_SECURITY_ADMIN_PASSWORD: the
    # chart writes its own <release>-grafana secret from this value, and that secret is
    # what the k8s sidecars (dashboard/datasource import) authenticate with. Setting
    # only the env var would leave the sidecars holding a different password than
    # Grafana itself -- a 401 and dashboards that silently never appear, while Grafana
    # looks perfectly healthy. It also stops the chart generating a fresh random
    # password on every render.
    - kind: Secret
      name: grafana-admin
  values:
    # CRDs seeded at bootstrap (00-crds.yaml); Flux keeps them current via the
    # global crds: CreateReplace patch, so keep the chart's `crds` subchart enabled.
    crds:
      enabled: true
    alertmanager:
      enabled: true
      alertmanagerSpec:
        podMetadata:
          annotations:
            reloader.stakater.com/auto: "true"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
      config:
        route:
          receiver: ntfy
          group_by: ["alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          - name: ntfy
            webhook_configs:
              - url: http://alertmanager-ntfy.observability.svc.cluster.local:8000/hook
                send_resolved: true
    grafana:
      enabled: true
      # Single replica holding an RWO Longhorn volume, so a rolling update deadlocks:
      # maxSurge starts the new pod (possibly on another node), maxUnavailable keeps the
      # old one until the new is Ready, and the new can never attach a volume the old
      # still holds. Grafana sat in Init:0/1 on exactly this -- Multi-Attach, with the
      # old pod named in the event. Recreate tears the old pod down first, which
      # releases the volume. Same reasoning as subgen's strategy.
      deploymentStrategy:
        type: Recreate
        # Belt and braces, and it documents the intent: this field must be absent for a
        # Recreate strategy to be valid. The API defaults it onto any Deployment created
        # with type RollingUpdate, so leaving it out is not the same as it not existing.
        #
        # Under server-side apply (the default here) a null only removes this manager's
        # claim on the field -- it will not delete one another manager owns, which is why
        # getting here needed a one-off strategic merge patch. See the note on `upgrade`.
        rollingUpdate: null
      podAnnotations:
        reloader.stakater.com/auto: "true"
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        # OIDC-only for humans: hide the login form; basic auth stays enabled
        # so the k8s-sidecars can authenticate to the API (dashboard/datasource import)
        auth:
          disable_login_form: true
        auth.generic_oauth:
          enabled: true
          name: Authelia
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${SECRET_DOMAIN}/api/oidc/token
          api_url: https://auth.${SECRET_DOMAIN}/api/oidc/userinfo
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      # oauth client secret via GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      envFromSecret: grafana-oauth
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.observability.svc.cluster.local
    # Talos does not expose these control-plane components for scraping
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        podMetadata:
          annotations:
            reloader.stakater.com/auto: "true"
        retention: 30d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
