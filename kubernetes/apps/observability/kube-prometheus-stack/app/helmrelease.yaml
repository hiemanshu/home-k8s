---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # CRDs seeded at bootstrap (00-crds.yaml); Flux keeps them current via the
    # global crds: CreateReplace patch, so keep the chart's `crds` subchart enabled.
    crds:
      enabled: true
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        # OIDC-only for humans: hide the login form; basic auth stays enabled
        # so the k8s-sidecars can authenticate to the API (dashboard/datasource import)
        auth:
          disable_login_form: true
        auth.generic_oauth:
          enabled: true
          name: Authelia
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${SECRET_DOMAIN}/api/oidc/token
          api_url: https://auth.${SECRET_DOMAIN}/api/oidc/userinfo
          role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      # oauth client secret via GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      envFromSecret: grafana-oauth
    # Talos does not expose these control-plane components for scraping
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 30d
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
