---
# kube-prometheus-stack ships three things with a route or a consumer each:
# Grafana (routed + a Homepage widget), Prometheus (scrapes; Grafana queries it)
# and Alertmanager (receives from Prometheus, posts to ntfy).
#
# These policies are Ingress-only, so Prometheus's scraping egress is unaffected --
# what matters is that each *target* allows observability, which is why the
# postgres and dragonfly policies already list it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - port: 3000
    # Homepage's grafana widget reads the API over the service
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - port: 3000
    # Prometheus scrapes Grafana's metrics; Alertmanager/Grafana in-namespace
    - from:
        - podSelector: {}
