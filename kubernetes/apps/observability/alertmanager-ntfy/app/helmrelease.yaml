---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alertmanager-ntfy
spec:
  chartRef:
    kind: OCIRepository
    name: alertmanager-ntfy
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      alertmanager-ntfy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/alexbakker/alertmanager-ntfy
              tag: 1.2.1@sha256:2a862f23c8fb67f777824979487c06a417b2f9bbbc2eb45a974a1fb45b9bbff3
            args:
              - --configs
              - /config/config.yml,/config/auth.yml
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    service:
      app:
        controller: alertmanager-ntfy
        ports:
          http:
            port: 8000
    persistence:
      config:
        type: configMap
        name: alertmanager-ntfy-config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
      auth:
        type: secret
        name: alertmanager-ntfy-secret
        globalMounts:
          - path: /config/auth.yml
            subPath: auth.yml
