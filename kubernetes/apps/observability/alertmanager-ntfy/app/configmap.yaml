---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-ntfy-config
data:
  config.yml: |
    http:
      addr: :8000
    ntfy:
      baseurl: https://notify.${SECRET_DOMAIN}
      notification:
        topic: alerts
        priority: |
          status == "firing" ? "urgent" : "default"
        tags:
          - tag: "+1"
            condition: status == "resolved"
          - tag: rotating_light
            condition: status == "firing"
        templates:
          title: |
            {{ if eq .Status "resolved" }}Resolved: {{ end }}{{ index .Annotations "summary" }}
          description: |
            {{ index .Annotations "description" }}
          headers:
            X-Click: |
              {{ .GeneratorURL }}
