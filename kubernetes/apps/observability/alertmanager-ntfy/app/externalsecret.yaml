---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-ntfy-secret
    template:
      data:
        auth.yml: |
          ntfy:
            auth:
              token: "{{ .PUBLISH_TOKEN }}"
  dataFrom:
    - extract:
        key: notify
