---
# The publish token for Gatus's ntfy alerts. Same 1Password `notify` item and the
# same PUBLISH_TOKEN the Alertmanager bridge uses (`observability/alertmanager-ntfy`),
# so one subscription on the phone covers both and there is one credential to rotate.
#
# It is delivered as an env var rather than into the config, because the config is a
# ConfigMap and would otherwise carry the token into git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-secret
    template:
      data:
        NTFY_TOKEN: "{{ .PUBLISH_TOKEN }}"
  dataFrom:
    - extract:
        key: notify
