---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  policyTypes:
    - Ingress
  ingress:
    # the internal gateway fronts the UI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - port: 8080
    # Homepage reads the Gatus API for its widget. Gatus's API is unauthenticated,
    # so this is the only consumer that bypasses the gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - port: 8080
