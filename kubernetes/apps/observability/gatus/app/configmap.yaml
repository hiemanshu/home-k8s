---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  # Two kinds of check, split by how a request can reach the app at all.
  #
  # Names on `envoy-external`, plus the internal ones Authelia marks `bypass`, are
  # checked over HTTPS on the real hostname: that exercises DNS, the gateway, TLS
  # and the app, not just "the pod is listening". Conditions are
  # `[STATUS] < 400` because several of those apps legitimately answer 302 (their
  # own OIDC), while 404 and 5xx both mean something is actually broken.
  #
  # Everything else routes on `envoy-internal`, which carries a *gateway-wide*
  # ext-auth SecurityPolicy (`network/envoy-gateway`), so Authelia answers before
  # the app does. Authelia only redirects when the request accepts `text/html` --
  # otherwise it replies 401 (`getAuthzRedirectStatusCode`, `internal/handlers/`
  # `handler_authz_util.go` in Authelia 4.39). Gatus sends no `Accept` header
  # (request headers are opt-in per endpoint), so every forward-auth'd host read
  # as down while the browser was perfectly happy. Those are checked against the
  # Service instead, which is also the honest check: behind ext-auth a 302 comes
  # back even when the backend is dead, so a check *through* the internal gateway
  # could never go red for a broken app.
  #
  # Accepted consequence: the internal apps below are checked against their
  # Services rather than through `envoy-internal`. One exception is deliberate --
  # `status.` is internal-only and forward-auth'd, so it really does land on that
  # gateway, and its redirect back proves DNS -> the internal VIP -> the listener
  # -> TLS -> Authelia in a single check. If that gateway breaks, that row goes
  # red even though this page would then be unopenable.
  #
  # Paths are the same health endpoints the pods' own probes use.
  #
  # `${SECRET_DOMAIN}` is substituted by Flux, so the domain stays in one place.
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db
      maximum-number-of-results: 200
      maximum-number-of-events: 100

    ui:
      title: Homelab
      description: Service reachability
      header: Homelab
      default-sort-by: group
      default-sort-order: asc

    endpoints:
      - name: Authelia
        group: Identity
        url: https://auth.${SECRET_DOMAIN}/api/health
        conditions: ["[STATUS] < 400"]
      - name: lldap
        group: Identity
        url: tcp://lldap.auth.svc.cluster.local:3890
        conditions: ["[CONNECTED] == true"]

      - name: Forgejo
        group: Dev
        url: https://git.${SECRET_DOMAIN}/api/healthz
        conditions: ["[STATUS] < 400"]
      - name: gitea-mirror
        group: Dev
        url: http://gitea-mirror.dev.svc.cluster.local:4321/api/health
        conditions: ["[STATUS] < 400"]

      - name: Immich
        group: Photos
        url: https://photos.${SECRET_DOMAIN}/api/server/ping
        conditions: ["[STATUS] < 400"]

      - name: OpenCloud
        group: Files
        url: https://files.${SECRET_DOMAIN}/
        conditions: ["[STATUS] < 400"]
      - name: Zipline
        group: Files
        url: https://share.${SECRET_DOMAIN}/api/healthcheck
        conditions: ["[STATUS] < 400"]
      - name: CouchDB
        group: Files
        url: tcp://obsidian-couchdb.database.svc.cluster.local:5984
        conditions: ["[CONNECTED] == true"]

      - name: Plex
        group: Media
        url: https://plex.${SECRET_DOMAIN}/identity
        conditions: ["[STATUS] < 400"]
      - name: Radarr
        group: Media
        url: http://radarr.media.svc.cluster.local:80/ping
        conditions: ["[STATUS] < 400"]
      - name: Sonarr
        group: Media
        url: http://sonarr.media.svc.cluster.local:80/ping
        conditions: ["[STATUS] < 400"]
      - name: Prowlarr
        group: Media
        url: http://prowlarr.media.svc.cluster.local:80/ping
        conditions: ["[STATUS] < 400"]
      - name: SABnzbd
        group: Media
        url: http://sabnzbd.media.svc.cluster.local:80/api?mode=version
        conditions: ["[STATUS] < 400"]
      - name: Bazarr
        group: Media
        url: http://bazarr.media.svc.cluster.local:6767/api/system/ping
        conditions: ["[STATUS] < 400"]
      - name: qBittorrent
        group: Media
        # the client itself, not the `downloads.` UI (vuetorrent) in front of it
        url: http://qbittorrent.media.svc.cluster.local:8080/
        conditions: ["[STATUS] < 400"]

      - name: Grafana
        group: Monitoring
        url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local:80/api/health
        conditions: ["[STATUS] < 400"]
      - name: ntfy
        group: Monitoring
        url: https://notify.${SECRET_DOMAIN}/v1/health
        conditions: ["[STATUS] < 400"]
      - name: Homepage
        group: Monitoring
        url: http://homepage.default.svc.cluster.local:3000/
        conditions: ["[STATUS] < 400"]
      - name: Gatus
        group: Monitoring
        # The one check that goes through `envoy-internal` on purpose. `status.` is
        # internal-only and Authelia-gated, so nothing about the app is being
        # tested here -- what is being tested is the edge in front of it.
        #
        # `Accept: text/html` is the whole point: without an Accept header Authelia
        # answers 401 and this reads as broken; with it, Authelia redirects (302),
        # gatus follows to the portal and lands on a 200. See the header comment.
        url: https://status.${SECRET_DOMAIN}/
        headers:
          Accept: text/html
        conditions: ["[STATUS] < 400"]

      - name: Longhorn
        group: Infrastructure
        url: http://longhorn-frontend.storage.svc.cluster.local:80/
        conditions: ["[STATUS] < 400"]
      - name: KubeVirt Manager
        group: Infrastructure
        url: http://kubevirt-manager.virtualization.svc.cluster.local:8080/
        conditions: ["[STATUS] < 400"]
      - name: AdGuard
        group: Infrastructure
        url: http://adguard-dns-internal.network.svc.cluster.local:3000/
        conditions: ["[STATUS] < 400"]
