---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-db-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lldap-db-password
    template:
      data:
        username: "lldap"
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: lldap
