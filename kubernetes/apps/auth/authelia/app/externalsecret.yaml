---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  data:
    # reuse the lldap admin/bind password rather than duplicating it
    - secretKey: LDAP_PASSWORD
      remoteRef:
        key: lldap
        property: LLDAP_LDAP_USER_PASS
    # Forgejo's OIDC client secret (shared with the app)
    - secretKey: FORGEJO_OIDC_CLIENT_SECRET
      remoteRef:
        key: forgejo
        property: OIDC_CLIENT_SECRET
    # Zipline's OIDC client secret (shared with the app)
    - secretKey: ZIPLINE_OIDC_CLIENT_SECRET
      remoteRef:
        key: zipline
        property: OIDC_CLIENT_SECRET
  dataFrom:
    - extract:
        key: authelia
  target:
    name: authelia-secret
    template:
      data:
        session_secret: "{{ .SESSION_SECRET }}"
        storage_encryption_key: "{{ .STORAGE_ENCRYPTION_KEY }}"
        storage_password: "{{ .DB_PASSWORD }}"
        ldap_password: "{{ .LDAP_PASSWORD }}"
        oidc_hmac_secret: "{{ .OIDC_HMAC_SECRET }}"
        oidc_jwks_key: "{{ .OIDC_JWKS_KEY }}"
        grafana_oauth_client_secret: "{{ .GRAFANA_OAUTH_CLIENT_SECRET }}"
        forgejo_oauth_client_secret: "{{ .FORGEJO_OIDC_CLIENT_SECRET }}"
        zipline_oauth_client_secret: "{{ .ZIPLINE_OIDC_CLIENT_SECRET }}"
