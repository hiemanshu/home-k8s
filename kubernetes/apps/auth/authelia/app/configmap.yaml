---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    ---
    theme: auto
    log:
      level: info
    server:
      address: tcp://0.0.0.0:9091
      endpoints:
        authz:
          forward-auth:
            implementation: 'ForwardAuth'
          ext-authz:
            implementation: 'ExtAuthz'
    totp:
      disable: false
      issuer: ${SECRET_DOMAIN}
    webauthn:
      disable: false
      # A passkey login counts as a single factor. That is enough for every
      # one_factor rule (regular users: one passkey tap). The two_factor admin
      # rules additionally require the password, so admins present passkey +
      # password. No experimental options.
      enable_passkey_login: true
      display_name: Authelia
    ntp:
      address: 'udp://pool.ntp.org:123'
    authentication_backend:
      refresh_interval: 1m
      password_reset:
        disable: true
      password_change:
        disable: true
      ldap:
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:3890
        base_dn: dc=heems,dc=dev
        user: uid=heems,ou=people,dc=heems,dc=dev
        attributes:
          username: uid
          display_name: displayName
          mail: mail
          group_name: cn
    session:
      cookies:
        - name: authelia_session
          domain: ${SECRET_DOMAIN}
          authelia_url: https://auth.${SECRET_DOMAIN}
          same_site: lax
          expiration: 1h
          inactivity: 5m
          remember_me: 1M
      redis:
        host: dragonfly.auth.svc.cluster.local
        port: 6379
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      postgres:
        address: tcp://postgres-rw.auth.svc.cluster.local:5432
        database: authelia
        username: authelia
    notifier:
      # Shared SMTP (1Password item `smtp`, Fastmail). Every value except the
      # identifier comes from the secret so the item stays the single source.
      # NOTE: Authelia validates SMTP at startup and EXITS if the check fails,
      # so a bad credential here takes auth (and therefore every app) down until
      # the secret is corrected -- reloader then restarts it.
      smtp:
        address: 'submissions://{{ secret "/secrets/smtp_host" }}:{{ secret "/secrets/smtp_port" }}'
        username: '{{ secret "/secrets/smtp_username" }}'
        password: '{{ secret "/secrets/smtp_password" }}'
        sender: 'no-reply@auth.${SECRET_DOMAIN}'
        identifier: ${SECRET_DOMAIN}
        subject: '[Authelia] {title}'
    access_control:
      # Default deny. Nothing internal is reachable unless a rule below grants it.
      # NOTE: apps that gate themselves with their own OIDC against Authelia get
      # `bypass` here (the app is the gate, Authelia is the IdP) -- planned for
      # git / files / immich / share as they land. Everything protected at the edge
      # by forward-auth instead gets a group rule below.
      default_policy: deny
      rules:
        # Portal must be reachable before login (frontend, OIDC, assets).
        - domain: auth.${SECRET_DOMAIN}
          policy: bypass
        # ntfy is intentionally public and enforces its own users/tokens.
        - domain: notify.${SECRET_DOMAIN}
          policy: bypass
        # Forgejo self-gates via OIDC (Authelia is the IdP, not the edge gate).
        - domain: git.${SECRET_DOMAIN}
          policy: bypass
        # Zipline self-gates via OIDC + upload API tokens.
        - domain: share.${SECRET_DOMAIN}
          policy: bypass
        # Immich self-gates via OIDC (configured in its admin UI).
        - domain: photos.${SECRET_DOMAIN}
          policy: bypass
        # OpenCloud self-gates via OIDC (Authelia is the IdP, not the edge gate).
        - domain: files.${SECRET_DOMAIN}
          policy: bypass
        # Dashboard: any authenticated user.
        - domain: home.${SECRET_DOMAIN}
          policy: one_factor
        # Admin-only UIs (servarr media UIs + cluster/admin surfaces).
        - domain:
            - grafana.${SECRET_DOMAIN}
            - users.${SECRET_DOMAIN}
            - longhorn.${SECRET_DOMAIN}
            - secrets.${SECRET_DOMAIN}
            - mirror.${SECRET_DOMAIN}
            - radarr.${SECRET_DOMAIN}
            - sonarr.${SECRET_DOMAIN}
            - prowlarr.${SECRET_DOMAIN}
            - sabnzbd.${SECRET_DOMAIN}
            - tautulli.${SECRET_DOMAIN}
            - downloads.${SECRET_DOMAIN}
          subject:
            - 'group:admins'
          # Admins present two factors: a passkey AND the password. (A passkey
          # login alone is one factor, so two_factor still asks for the
          # password.)
          policy: two_factor
    identity_providers:
      oidc:
        hmac_secret: {{ secret "/secrets/oidc_hmac_secret" }}
        jwks:
          - key_id: default
            key: {{ secret "/secrets/oidc_jwks_key" | mindent 10 "|" | msquote }}
        # OpenCloud Web is the only browser SPA here: it exchanges the auth code
        # from files.<domain> against the token endpoint on auth.<domain>, which
        # is cross-origin and therefore needs CORS. Every other client does the
        # exchange server-side and needs nothing here.
        cors:
          endpoints:
            - authorization
            - token
            - userinfo
            - revocation
          allowed_origins:
            - https://files.${SECRET_DOMAIN}
        claims_policies:
          default:
            id_token:
              - groups
              - email
              - email_verified
              - preferred_username
              - name
        authorization_policies:
          # The OIDC apps are `bypass` at the edge, so group scoping has to
          # happen here rather than in access_control. Default deny + one group
          # rule = tool-scoped access. Every policy also allows group:admins so
          # an admin can never lock themselves out of a tool.
          dev:
            default_policy: deny
            rules:
              - subject:
                  - 'group:dev'
                  - 'group:admins'
                policy: one_factor
          media:
            default_policy: deny
            rules:
              - subject:
                  - 'group:media'
                  - 'group:admins'
                policy: one_factor
          tools:
            default_policy: deny
            rules:
              - subject:
                  - 'group:tools'
                  - 'group:admins'
                policy: one_factor
          admins:
            default_policy: deny
            rules:
              - subject: 'group:admins'
                policy: one_factor
        clients:
          - client_id: grafana
            client_name: Grafana
            client_secret: {{ secret "/secrets/grafana_oauth_client_secret" }}
            redirect_uris:
              - https://grafana.${SECRET_DOMAIN}/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            authorization_policy: admins
            pre_configured_consent_duration: 1y
            userinfo_signed_response_alg: none
            claims_policy: default
          - client_id: forgejo
            client_name: Forgejo
            client_secret: {{ secret "/secrets/forgejo_oauth_client_secret" }}
            redirect_uris:
              - https://git.${SECRET_DOMAIN}/user/oauth2/authelia/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            authorization_policy: dev
            pre_configured_consent_duration: 1y
            userinfo_signed_response_alg: none
            claims_policy: default
          - client_id: zipline
            client_name: Zipline
            client_secret: {{ secret "/secrets/zipline_oauth_client_secret" }}
            redirect_uris:
              - https://share.${SECRET_DOMAIN}/api/auth/oauth/oidc
            scopes:
              - openid
              - offline_access
              - email
              - profile
            response_types:
              - code
            grant_types:
              - refresh_token
              - authorization_code
            authorization_policy: tools
            pre_configured_consent_duration: 1y
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_post
            claims_policy: default
          - client_id: immich
            client_name: Immich
            client_secret: {{ secret "/secrets/immich_oauth_client_secret" }}
            public: false
            authorization_policy: media
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://photos.${SECRET_DOMAIN}/auth/login
              - https://photos.${SECRET_DOMAIN}/user-settings
              - app.immich:///oauth-callback
            scopes:
              - openid
              - profile
              - email
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
            claims_policy: default
          # OpenCloud Web is a browser SPA: a public client with no secret.
          # OpenCloud does not send a PKCE challenge, so PKCE must stay off.
          # The three redirect URIs match OpenCloud's own Keycloak client def.
          - client_id: opencloud
            client_name: OpenCloud
            public: true
            authorization_policy: tools
            redirect_uris:
              - https://files.${SECRET_DOMAIN}/
              - https://files.${SECRET_DOMAIN}/oidc-callback.html
              - https://files.${SECRET_DOMAIN}/oidc-silent-redirect.html
            scopes:
              - openid
              - profile
              - email
              - groups
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none
            pre_configured_consent_duration: 1y
            claims_policy: default
