---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    ---
    theme: auto
    log:
      level: debug
    server:
      address: tcp://0.0.0.0:9091
      endpoints:
        authz:
          forward-auth:
            implementation: 'ForwardAuth'
          ext-authz:
            implementation: 'ExtAuthz'
    totp:
      disable: false
      issuer: ${SECRET_DOMAIN}
    webauthn:
      disable: false
      enable_passkey_login: true
      display_name: Authelia
    authentication_backend:
      refresh_interval: 1m
      password_reset:
        disable: true
      password_change:
        disable: true
      ldap:
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:3890
        base_dn: dc=heems,dc=dev
        user: uid=heems,ou=people,dc=heems,dc=dev
        attributes:
          username: uid
          display_name: displayName
          mail: mail
          group_name: cn
    session:
      cookies:
        - name: authelia_session
          domain: ${SECRET_DOMAIN}
          authelia_url: https://auth.${SECRET_DOMAIN}
          same_site: lax
          expiration: 1h
          inactivity: 5m
          remember_me: 1M
      redis:
        host: dragonfly.auth.svc.cluster.local
        port: 6379
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      postgres:
        address: tcp://postgres-rw.auth.svc.cluster.local:5432
        database: authelia
        username: authelia
    notifier:
      filesystem:
        filename: /data/notification.txt
    access_control:
      default_policy: deny
      rules:
        - domain: auth.${SECRET_DOMAIN}
          policy: bypass
