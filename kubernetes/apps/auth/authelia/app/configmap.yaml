---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    ---
    theme: auto
    log:
      level: info
    server:
      address: tcp://0.0.0.0:9091
      endpoints:
        authz:
          forward-auth:
            implementation: 'ForwardAuth'
          ext-authz:
            implementation: 'ExtAuthz'
    totp:
      disable: false
      issuer: ${SECRET_DOMAIN}
    webauthn:
      disable: false
      enable_passkey_login: true
      display_name: Authelia
    ntp:
      address: 'udp://pool.ntp.org:123'
    authentication_backend:
      refresh_interval: 1m
      password_reset:
        disable: true
      password_change:
        disable: true
      ldap:
        implementation: lldap
        address: ldap://lldap.auth.svc.cluster.local:3890
        base_dn: dc=heems,dc=dev
        user: uid=heems,ou=people,dc=heems,dc=dev
        attributes:
          username: uid
          display_name: displayName
          mail: mail
          group_name: cn
    session:
      cookies:
        - name: authelia_session
          domain: ${SECRET_DOMAIN}
          authelia_url: https://auth.${SECRET_DOMAIN}
          same_site: lax
          expiration: 1h
          inactivity: 5m
          remember_me: 1M
      redis:
        host: dragonfly.auth.svc.cluster.local
        port: 6379
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
    storage:
      postgres:
        address: tcp://postgres-rw.auth.svc.cluster.local:5432
        database: authelia
        username: authelia
    notifier:
      filesystem:
        filename: /data/notification.txt
    access_control:
      # Default deny. Nothing internal is reachable unless a rule below grants it.
      # NOTE: apps that gate themselves with their own OIDC against Authelia get
      # `bypass` here (the app is the gate, Authelia is the IdP) -- planned for
      # git / files / immich / share as they land. Everything protected at the edge
      # by forward-auth instead gets a group rule below.
      default_policy: deny
      rules:
        # Portal must be reachable before login (frontend, OIDC, assets).
        - domain: auth.${SECRET_DOMAIN}
          policy: bypass
        # ntfy is intentionally public and enforces its own users/tokens.
        - domain: notify.${SECRET_DOMAIN}
          policy: bypass
        # Dashboard: any authenticated user.
        - domain: home.${SECRET_DOMAIN}
          policy: one_factor
        # Admin-only UIs (servarr media UIs + cluster/admin surfaces).
        - domain:
            - grafana.${SECRET_DOMAIN}
            - users.${SECRET_DOMAIN}
            - longhorn.${SECRET_DOMAIN}
            - secrets.${SECRET_DOMAIN}
            - radarr.${SECRET_DOMAIN}
            - sonarr.${SECRET_DOMAIN}
            - prowlarr.${SECRET_DOMAIN}
            - sabnzbd.${SECRET_DOMAIN}
            - tautulli.${SECRET_DOMAIN}
          subject:
            - 'group:admins'
          policy: one_factor
    identity_providers:
      oidc:
        hmac_secret: {{ secret "/secrets/oidc_hmac_secret" }}
        jwks:
          - key_id: default
            key: {{ secret "/secrets/oidc_jwks_key" | mindent 10 "|" | msquote }}
        claims_policies:
          default:
            id_token:
              - groups
              - email
              - email_verified
              - preferred_username
              - name
        clients:
          - client_id: grafana
            client_name: Grafana
            client_secret: {{ secret "/secrets/grafana_oauth_client_secret" }}
            redirect_uris:
              - https://grafana.${SECRET_DOMAIN}/login/generic_oauth
            scopes:
              - openid
              - profile
              - email
              - groups
            authorization_policy: one_factor
            pre_configured_consent_duration: 1y
            userinfo_signed_response_alg: none
            claims_policy: default
