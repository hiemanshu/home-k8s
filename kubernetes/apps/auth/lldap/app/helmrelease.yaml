---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
spec:
  chartRef:
    kind: OCIRepository
    name: lldap
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      lldap:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.3
            env:
              LLDAP_LDAP_BASE_DN: dc=heems,dc=dev
              LLDAP_LDAP_USER_DN: heems
              LLDAP_LDAP_USER_EMAIL: heems@heems.dev
              LLDAP_LDAP_PORT: "3890"
              LLDAP_HTTP_PORT: "17170"
            envFrom:
              - secretRef:
                  name: lldap-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 17170
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 17170
    service:
      ldap:
        controller: lldap
        ports:
          ldap:
            port: 3890
          http:
            port: 17170
