---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lldap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  policyTypes:
    - Ingress
  ingress:
    # any pod in the auth namespace (authelia); more consumers added later
    - from:
        - podSelector: {}
      ports:
        - port: 3890
        - port: 17170
