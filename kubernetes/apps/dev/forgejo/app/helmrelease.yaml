---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  interval: 30m
  values:
    image:
      rootless: true
      registry: code.forgejo.org
      repository: forgejo/forgejo
      tag: 16.0.6-rootless
      # this chart composes registry/repository:tag and takes the digest in its
      # own field -- appending @sha256: to the tag yields Init:InvalidImageName
      digest: sha256:51b47921660e1ec7127f094208fe06901ba57df4fe6d59fcccc3a2419514a77f
    gitea:
      # no local admin account; the first OIDC login in the `admins` group becomes admin
      admin:
        username: ""
      # secrets injected as FORGEJO__<SECTION>__<KEY> env for the config init container
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: db-password
        - name: FORGEJO__STORAGE__MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-endpoint
        - name: FORGEJO__STORAGE__MINIO_BUCKET
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-bucket
        - name: FORGEJO__STORAGE__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-access-key-id
        - name: FORGEJO__STORAGE__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-secret-access-key
        # [lfs] needs its own copy: a subsystem section does not inherit MINIO_*
        # from [storage], and app.ini keeps the section once written
        - name: FORGEJO__LFS__MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-endpoint
        - name: FORGEJO__LFS__MINIO_BUCKET
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-bucket
        - name: FORGEJO__LFS__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-access-key-id
        - name: FORGEJO__LFS__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-secret
              key: s3-secret-access-key
      config:
        APP_NAME: Forgejo
        server:
          DOMAIN: git.${SECRET_DOMAIN}
          ROOT_URL: https://git.${SECRET_DOMAIN}/
          PROTOCOL: http
          HTTP_PORT: 3000
          DISABLE_SSH: true
          START_SSH_SERVER: false
          LFS_START_SERVER: true
          OFFLINE_MODE: true
          DISABLE_ROUTER_LOG: true
        database:
          DB_TYPE: postgres
          HOST: postgres-rw.dev.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
          SSL_MODE: require
        cache:
          ENABLED: true
          ADAPTER: redis
          HOST: redis://dragonfly.dev.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s
        queue:
          TYPE: redis
          CONN_STR: redis://dragonfly.dev.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s
        session:
          PROVIDER: redis
          PROVIDER_CONFIG: redis://dragonfly.dev.svc.cluster.local:6379/0?pool_size=100&idle_timeout=180s
          SESSION_LIFE_TIME: 1209600
        # object storage for every subsystem via the [storage] defaults
        # (endpoint/bucket/keys come from the secret via env).
        storage:
          STORAGE_TYPE: minio
          MINIO_USE_SSL: false
          MINIO_LOCATION: us-east-1
        # [lfs] needs it explicitly (see the FORGEJO__LFS__ env above)
        lfs:
          STORAGE_TYPE: minio
          MINIO_USE_SSL: false
          MINIO_LOCATION: us-east-1
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
          ENABLE_INTERNAL_SIGNIN: false
          ENABLE_PASSWORD_SIGNIN_FORM: false
          DEFAULT_ENABLE_TIMETRACKING: false
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
        security:
          INSTALL_LOCK: true
          REVERSE_PROXY_TRUSTED_PROXIES: 10.42.0.0/16
          LOGIN_REMEMBER_DAYS: 14
        repository:
          ROOT: /data/git/repositories
          DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.actions
          DISABLED_REPO_UNITS: repo.ext_wiki,repo.ext_issues
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        cron.archive_cleanup:
          ENABLED: true
          RUN_AT_START: true
          SCHEDULE: "@every 1h"
          OLDER_THAN: 2h
        mailer:
          ENABLED: false
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
        webhook:
          ALLOWED_HOST_LIST: "*"
      oauth:
        - name: authelia
          provider: openidConnect
          existingSecret: forgejo-oauth2-credentials
          autoDiscoverUrl: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
          groupClaimName: groups
          adminGroup: admins
          scopes: openid profile email groups
          skipLocal-2fa: true
    persistence:
      enabled: true
      create: false
      claimName: forgejo
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
