---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  storage:
    storageClass: longhorn
    size: 10Gi
  monitoring:
    # deprecated flag; we manage the PodMonitor ourselves (podmonitor.yaml)
    enablePodMonitor: false
  bootstrap:
    initdb:
      database: app
      owner: app
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        passwordSecret:
          name: forgejo-db-password
  # The barman-cloud plugin provides object-store backups with WAL archiving,
  # i.e. point-in-time recovery. Enabling a plugin rolls the Postgres instances,
  # because the plugin also runs as a sidecar inside the instance pods.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: postgres-s3
