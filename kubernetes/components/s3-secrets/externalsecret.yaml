---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# S3 connection details + credentials, as a COMPONENT rather than an app, because
# Flux's postBuild.substituteFrom resolves a Secret in the Kustomization's OWN
# namespace -- exactly like the `sops` component that puts cluster-secrets in
# every namespace. A single copy in flux-system is invisible to Kustomizations
# elsewhere, and with `optional: true` on the substituteFrom entry that failure
# is silent: the manifest is applied with a literal ${S3_ENDPOINT} instead.
#
# Add to any namespace whose manifests need ${S3_ENDPOINT} / ${S3_BUCKET}, or the
# S3 credentials themselves.
#
# The endpoint lives in 1Password so it changes in exactly one place -- it is the
# value that moves when the S3 API comes in-cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: s3-secrets
    template:
      data:
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: cnpg
